<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品需求落地 · 项目工作台</title>
<style>__WORKBENCH_STYLE__</style>
</head>
<body>
<div class="workspace">
<aside class="sidebar" aria-label="项目导航">
<a href="#overview" class="brand"><span class="brand-text" id="project-brand">项目工作台</span></a>
<nav class="nav-list" id="navigation"></nav>
</aside>
<main class="main-shell">
<header class="topbar"><div class="breadcrumb"><span id="project-label"></span><span aria-hidden="true">/</span><span id="view-label">总览</span></div><button class="button ghost small" id="export-project" type="button">导出数据</button></header>
<div class="content">
<header class="page-header"><h1 class="page-title" id="page-title" tabindex="-1">总览</h1></header>
<div class="workbench-notice" id="project-status"></div>
<div class="workbench-toolbar" role="search">
<label class="sr-only" for="search">搜索需求、原话或模块</label><input id="search" type="search" aria-label="搜索需求、原话或模块" placeholder="搜索需求、原话或模块">
<select id="status" aria-label="需求状态"><option value="">全部需求状态</option><option value="draft">草稿</option><option value="confirmed">已确认</option><option value="disputed">冲突</option><option value="parked">暂缓</option></select>
<select id="evidence" aria-label="证据类型"><option value="">全部证据类型</option><option value="explicit">明确表达</option><option value="inferred">模型推断</option><option value="suggested">产品建议</option><option value="unknown">待确认</option></select>
</div>
<div id="page-content" class="requirement-pages" aria-live="polite"></div>
</div>
</main>
</div>
<script id="workbench-data" type="application/json">__WORKBENCH_DATA__</script>
<script>__WORKBENCH_SCRIPT__</script>
</body>
</html>
