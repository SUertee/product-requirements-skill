<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>交互原型</title>
<style>__PROTOTYPE_STYLE__
html,body{overflow-x:clip}
.ui-nav{display:flex;flex-direction:column;gap:20px}
.ui-nav h1{font-size:var(--ui-text-md);font-weight:600;line-height:1.5;margin:0;padding:0 12px}
.ui-nav nav{display:grid;gap:4px}
.ui-nav a[aria-current="page"]{background:var(--ui-nav-active)}
.pt-role{display:grid;gap:6px;font-size:var(--ui-text-sm)}
.pt-role select{min-height:40px;padding:6px 10px;border-radius:var(--ui-radius-sm);border:1px solid var(--ui-nav-line);background:var(--ui-nav-hover);color:var(--ui-nav-ink);font:inherit}
.pt-notice{margin:0 0 20px;font-size:var(--ui-text-xs);color:var(--ui-muted)}
.pt-page:focus{outline:none}
.pt-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(480px,calc(100vw - 32px));padding:12px 18px;border-radius:var(--ui-radius);background:var(--ui-nav);color:var(--ui-nav-ink);box-shadow:var(--ui-shadow-overlay);z-index:20}
.pt-toast[data-kind="error"]{background:var(--ui-danger)}
.pt-denied{padding:48px 24px;text-align:center;color:var(--ui-muted)}
.pt-script-error{margin-bottom:16px;padding:12px 16px;border-radius:var(--ui-radius-sm);background:var(--ui-danger-soft);color:var(--ui-danger)}
[data-state]:not([data-state-active]){display:none !important}
html[data-annotate] [data-req],html[data-annotate] [data-nfr]{outline:2px dashed var(--ui-accent);outline-offset:3px;position:relative}
html[data-annotate] [data-nfr]:not([data-req]){outline-color:var(--ui-warning-mark)}
html[data-annotate] [data-req]::before,html[data-annotate] [data-nfr]::before{content:attr(data-req) " " attr(data-nfr);position:absolute;top:-11px;right:4px;padding:0 6px;border-radius:var(--ui-radius-sm);background:var(--ui-accent);color:var(--ui-on-accent);font-size:var(--ui-text-xs);line-height:18px;font-weight:600;white-space:nowrap;z-index:5;pointer-events:none}
html[data-annotate] [data-nfr]:not([data-req])::before{background:var(--ui-warning-mark)}
.pt-nav-group{margin:16px 12px 4px;font-size:var(--ui-text-xs);font-weight:600;color:var(--ui-nav-muted);letter-spacing:.02em}
.pt-nav-group:first-child{margin-top:4px}
html:not([data-archetype="workspace"]):not([data-archetype="dashboard"]) .pt-nav-group{display:none}
@media (max-width:899px){.pt-nav-group{display:none}}
/* Archetype skeletons: one UI spec, different navigation. workspace/dashboard keep the side nav, mobile_app uses .pt-mobile. */
html[data-archetype="website"] .ui-shell,html[data-archetype="flow"] .ui-shell,html[data-archetype="chat"] .ui-shell{display:block}
html[data-archetype="website"] .ui-nav,html[data-archetype="flow"] .ui-nav,html[data-archetype="chat"] .ui-nav{position:sticky;top:0;z-index:10;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding:12px 32px}
html[data-archetype="website"] .ui-nav nav,html[data-archetype="flow"] .ui-nav nav,html[data-archetype="chat"] .ui-nav nav{display:flex;flex-wrap:wrap;gap:4px}
html[data-archetype="website"] .ui-nav h1,html[data-archetype="flow"] .ui-nav h1,html[data-archetype="chat"] .ui-nav h1{font-size:var(--ui-text-md)}
html[data-archetype="website"] .ui-nav,html[data-archetype="flow"] .ui-nav,html[data-archetype="chat"] .ui-nav{border-bottom:1px solid var(--ui-nav-line)}
html[data-nav="light"] .ui-nav a[aria-current="page"]{color:var(--ui-accent-ink);font-weight:600}
html[data-nav="light"] .ui-nav{border-right:1px solid var(--ui-nav-line)}
html[data-archetype="website"] .ui-nav h1,html[data-archetype="flow"] .ui-nav h1,html[data-archetype="chat"] .ui-nav h1{margin-right:auto}
html[data-archetype="website"] .pt-role,html[data-archetype="flow"] .pt-role,html[data-archetype="chat"] .pt-role{order:2;grid-auto-flow:column;align-items:center}
html[data-archetype="website"] .ui-main{max-width:1120px}
html[data-archetype="flow"] .ui-main{max-width:760px}
html[data-archetype="chat"] .ui-main{max-width:960px}
html[data-archetype="dashboard"] .ui-main{max-width:1600px}
@media (max-width:899px){html[data-archetype="website"] .ui-nav,html[data-archetype="flow"] .ui-nav,html[data-archetype="chat"] .ui-nav{padding:10px 16px}}
.pt-mobile .ui-shell{display:block;max-width:480px;margin:0 auto;min-height:100dvh;background:var(--ui-page)}
.pt-mobile .ui-nav{position:sticky;top:0;z-index:10;padding:12px 16px;gap:10px}
.pt-mobile .ui-nav nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--ui-nav);z-index:10}
.pt-mobile .ui-nav nav a{flex:1;text-align:center;padding:10px 4px;font-size:var(--ui-text-sm)}
.pt-mobile .ui-main{padding:16px 16px 96px}
@media (max-width:899px){.ui-nav{gap:10px}.ui-nav h1{font-size:var(--ui-text-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ui-nav nav{display:flex;flex-wrap:nowrap;gap:4px;overflow-x:auto;scrollbar-width:none}.ui-nav nav a{flex:none;padding:8px 10px;white-space:nowrap}}
/* Narrow-screen safety net for page content: nothing wider than the screen, tables scroll in place. */
@media (max-width:599px){.ui-main .pt-page{overflow-wrap:anywhere}.ui-main .pt-page img,.ui-main .pt-page video{max-width:100%;height:auto}.ui-actions .ui-button{flex:1 1 auto}}
.pt-feedback{position:fixed;right:24px;bottom:24px;z-index:15;box-shadow:var(--ui-shadow-overlay)}
.pt-mobile .pt-feedback{right:16px;bottom:84px}
html[data-archetype="chat"] .pt-feedback{bottom:104px}
.pt-pickbar{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;max-width:calc(100vw - 32px);padding:10px 12px 10px 16px;border-radius:var(--ui-radius);background:var(--ui-nav);color:var(--ui-nav-ink);box-shadow:var(--ui-shadow-overlay);font-size:var(--ui-text-sm)}
.pt-pickbar .ui-button{min-height:36px;padding:4px 12px;font-size:var(--ui-text-sm)}
html[data-picking] #screen,html[data-picking] #screen *{cursor:crosshair !important}
.pt-pick-target{outline:2px solid var(--ui-accent) !important;outline-offset:2px;background-color:var(--ui-accent-soft)}
</style><style id="page-styles"></style></head>
<body><div class="ui-shell"><aside class="ui-nav"><h1 id="project-name"></h1><label class="pt-role" id="role-picker" hidden>当前角色<select id="role"></select></label><nav id="pages" aria-label="原型页面"></nav></aside><main class="ui-main"><p class="pt-notice" id="notice"></p><div id="screen"></div></main></div>
<div class="pt-toast" id="toast" role="status" aria-live="polite" hidden></div>
<button class="ui-button primary pt-feedback" id="feedback" type="button" hidden>提意见</button>
<div class="pt-pickbar" id="pickbar" role="dialog" aria-label="选择要提意见的位置" hidden><span>点选原型上要提意见的位置</span><button class="ui-button" id="pick-page" type="button">对整页提意见</button><button class="ui-button" id="pick-cancel" type="button">取消</button></div>
<script id="prototype-data" type="application/json">__PROTOTYPE_DATA__</script>
<script>
(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('prototype-data').textContent);
  const params = new URLSearchParams(location.search);
  const pages = new Map(data.pages.map(page => [page.page_id, page]));
  const sections = new Map();
  const showHandlers = new Map();
  const roleHandlers = [];
  const errors = window.__prototypeErrors = [];
  const roles = data.roles || [];
  let role = roles.some(item => item.role_id === params.get('role')) ? params.get('role') : (roles[0] || {}).role_id || '';
  let current = '';
  let toastTimer = 0;

  function h(tag, attributes, ...children) {
    const element = document.createElement(tag);
    for (const [key, value] of Object.entries(attributes || {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key === 'class') element.className = value;
      else if (key === 'text') element.textContent = String(value);
      else if (key.startsWith('on') && typeof value === 'function') element.addEventListener(key.slice(2), value);
      else element.setAttribute(key, value === true ? '' : String(value));
    }
    for (const child of children.flat()) if (child !== undefined && child !== null && child !== false) element.append(child instanceof Node ? child : document.createTextNode(String(child)));
    return element;
  }
  function allowed(page) { return !page.roles || !page.roles.length || !role || page.roles.includes(role); }
  function applyRoles(root) {
    for (const element of root.querySelectorAll('[data-roles]')) {
      const list = element.dataset.roles.split(',').map(item => item.trim()).filter(Boolean);
      element.hidden = Boolean(role) && !list.includes(role);
    }
  }
  function setState(name, pageId) {
    const section = sections.get(pageId || current);
    if (!section) return;
    for (const element of section.querySelectorAll('[data-state]')) {
      if (name && element.dataset.state === name) element.setAttribute('data-state-active', ''); else element.removeAttribute('data-state-active');
    }
    section.dataset.currentState = name || '';
  }
  function notify(text, kind) {
    const toast = document.getElementById('toast');
    toast.textContent = text; toast.dataset.kind = kind || 'success'; toast.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
  }
  function drawNav() {
    const nav = document.getElementById('pages'); nav.replaceChildren();
    // Side navigation follows the solution's business modules: a heading whenever the module changes.
    const moduleNames = Object.fromEntries((data.modules || []).map(item => [item.module_id, item.name]));
    const grouped = (data.modules || []).length > 1;
    let lastModule;
    for (const page of data.pages) {
      if (page.nav === false || !allowed(page)) continue;
      if (grouped && page.module_id && page.module_id !== lastModule && moduleNames[page.module_id]) nav.append(h('p', {class: 'pt-nav-group', text: moduleNames[page.module_id]}));
      lastModule = page.module_id;
      const link = h('a', {href: '#' + encodeURIComponent(page.page_id), 'data-page': page.page_id, text: page.name});
      if (page.page_id === current) link.setAttribute('aria-current', 'page');
      nav.append(link);
    }
  }
  const P = {
    h, notify, setState,
    data: JSON.parse(JSON.stringify(data.sample_data || {})),
    params: {},
    get role() { return role; },
    get page() { return current; },
    go(pageId, values) { P.params = values || {}; if (location.hash.slice(1) === encodeURIComponent(pageId)) show(pageId); else location.hash = encodeURIComponent(pageId); },
    onShow(pageId, handler) { const list = showHandlers.get(pageId) || []; list.push(handler); showHandlers.set(pageId, list); },
    onRole(handler) { roleHandlers.push(handler); },
    loading(ms, then) { setState('loading'); setTimeout(() => { setState(''); if (then) then(); }, ms || 600); },
  };
  window.Prototype = P;

  function show(pageId) {
    const page = pages.get(pageId) || pages.get(data.start_page_id) || data.pages[0];
    current = page.page_id;
    document.title = data.name + ' · ' + page.name;
    for (const [key, section] of sections) section.hidden = key !== current;
    const denied = document.getElementById('denied');
    denied.hidden = allowed(page);
    if (!allowed(page)) sections.get(current).hidden = true;
    setState('');
    drawNav();
    if (allowed(page)) for (const handler of showHandlers.get(current) || []) {
      try { handler(sections.get(current), P.params); } catch (error) { report(current, error); }
    }
    if (parent !== window) parent.postMessage({type: 'prototype:page', page_id: current}, '*');
    stopPicking();
    updateFeedback();
  }
  // Customers open the released prototype directly; the workbench preview (an iframe) keeps the button hidden.
  function updateFeedback() {
    document.getElementById('feedback').hidden = !data.feedback || parent !== window;
  }
  function feedbackUrl(location, requirementIds) {
    const page = pages.get(current);
    const url = new URL(data.feedback.url);
    const values = {'页面': page.name, '位置': location || page.name + '（整页）', '需求': requirementIds.join(' '),
      '原型版本': data.artifact_version, '项目': data.feedback.project_id};
    for (const [field, value] of Object.entries(values)) url.searchParams.set('prefill_' + field, value);
    for (const field of ['需求', '原型版本', '项目']) url.searchParams.set('hide_' + field, '1');
    return url.toString();
  }
  function openFeedback(location, requirementIds) {
    stopPicking();
    window.open(feedbackUrl(location, requirementIds), '_blank', 'noopener');
  }
  // Pick mode: describe what was clicked with labels and headers only, never the values a visitor typed or sample rows.
  const POINTABLE = 'button, a, input, select, textarea, label, th, td, li, h1, h2, h3, h4, [data-req], [data-nfr], .ui-card, section';
  const clean = value => String(value || '').replace(/\s+/g, ' ').trim().slice(0, 30);
  function describe(element) {
    const tag = element.tagName.toLowerCase();
    if (['input', 'select', 'textarea'].includes(tag)) {
      const label = element.labels?.[0] || element.closest('label');
      const name = clean(element.getAttribute('aria-label') || (label && [...label.childNodes].filter(node => node.nodeType === 3).map(node => node.textContent).join('')) || label?.textContent || element.placeholder || element.name);
      return name + (tag === 'select' ? '（下拉框）' : tag === 'textarea' ? '（文本框）' : element.type === 'checkbox' ? '（勾选框）' : '（输入框）');
    }
    if (tag === 'button' || tag === 'a') return clean(element.getAttribute('aria-label') || element.textContent) + (tag === 'a' ? '（链接）' : '（按钮）');
    if (tag === 'th') return clean(element.textContent) + '（表头）';
    if (tag === 'td') {
      const table = element.closest('table');
      const header = table && table.querySelectorAll('thead th')[element.cellIndex];
      return (header ? clean(header.textContent) + '列' : '表格') + '（表格内容）';
    }
    if (/^h[1-4]$/.test(tag)) return clean(element.textContent) + '（标题）';
    const heading = element.querySelector('h1, h2, h3, h4, legend');
    return clean(element.getAttribute('aria-label') || heading?.textContent || element.textContent) || '页面区域';
  }
  function target(node) {
    const section = sections.get(current);
    const element = node instanceof Element ? node.closest(POINTABLE) : null;
    return element && section && section.contains(element) && element !== section ? element : null;
  }
  // The workbench preview starts picking by message and gets the picked place back instead of opening the form.
  let picking = false, hovered = null, embeddedPick = false;
  function highlight(element) {
    hovered?.classList.remove('pt-pick-target');
    hovered = element;
    hovered?.classList.add('pt-pick-target');
  }
  function startPicking() {
    picking = true;
    document.documentElement.dataset.picking = '';
    document.getElementById('pickbar').hidden = false;
    document.getElementById('pick-page').focus();
  }
  function stopPicking() {
    if (embeddedPick) { embeddedPick = false; parent.postMessage({type: 'prototype:pick-end'}, '*'); }
    picking = false;
    delete document.documentElement.dataset.picking;
    document.getElementById('pickbar').hidden = true;
    highlight(null);
  }
  function choose(element) {
    const page = pages.get(current);
    const marked = element.closest('[data-req]');
    const ids = marked ? marked.dataset.req.split(/\s+/).filter(Boolean) : (page.requirement_ids || []);
    if (embeddedPick) { pickedInWorkbench(describe(element), ids); return; }
    openFeedback(page.name + ' › ' + describe(element), ids);
  }
  function pickedInWorkbench(location, ids) {
    parent.postMessage({type: 'prototype:picked', page_id: current, location, requirement_ids: ids}, '*');
    stopPicking();
  }
  document.getElementById('feedback').addEventListener('click', () => (picking ? stopPicking() : startPicking()));
  document.getElementById('pick-cancel').addEventListener('click', stopPicking);
  document.getElementById('pick-page').addEventListener('click', () => (embeddedPick ? pickedInWorkbench('整页', pages.get(current).requirement_ids || []) : openFeedback('', pages.get(current).requirement_ids || [])));
  document.addEventListener('mouseover', event => { if (picking) highlight(target(event.target)); });
  document.addEventListener('focusin', event => { if (picking) highlight(target(event.target)); });
  // Capture phase: while picking, a click selects the element instead of running the prototype's own action.
  document.addEventListener('click', event => {
    if (!picking) return;
    const element = target(event.target);
    if (!element) return;
    event.preventDefault(); event.stopImmediatePropagation();
    choose(element);
  }, true);
  document.addEventListener('keydown', event => {
    if (!picking) return;
    if (event.key === 'Escape') { stopPicking(); document.getElementById('feedback').focus(); }
    else if (event.key === 'Enter' && target(document.activeElement)) { event.preventDefault(); choose(target(document.activeElement)); }
  }, true);
  function report(pageId, error) {
    errors.push({page_id: pageId, message: String(error && error.message || error)});
    console.error('[prototype:' + pageId + ']', error);
    const section = sections.get(pageId);
    if (section && !section.querySelector('.pt-script-error')) section.prepend(h('p', {class: 'pt-script-error', role: 'alert', text: '页面脚本出错：' + (error && error.message || error)}));
  }

  document.getElementById('project-name').textContent = data.name;
  document.getElementById('notice').textContent = '交互原型 · ' + data.artifact_version + ' · 示例数据，操作只在本页面内模拟';
  const archetype = data.positioning.archetype || 'workspace';
  document.documentElement.dataset.archetype = archetype;
  document.documentElement.dataset.nav = (data.theme && data.theme.nav) || 'dark';
  if (archetype === 'mobile_app' || (data.positioning.target_devices || []).every(device => device === 'mobile')) document.documentElement.classList.add('pt-mobile');
  if (params.has('annotate')) document.documentElement.dataset.annotate = '';
  if (roles.length > 1) {
    const select = document.getElementById('role');
    for (const item of roles) select.append(h('option', {value: item.role_id, text: item.name}));
    select.value = role;
    select.addEventListener('change', () => {
      role = select.value;
      for (const section of sections.values()) applyRoles(section);
      for (const handler of roleHandlers) { try { handler(role); } catch (error) { report(current, error); } }
      show(current);
    });
    document.getElementById('role-picker').hidden = false;
  }
  document.getElementById('page-styles').textContent = data.pages.map(page => page.css || '').join('\n');
  const screen = document.getElementById('screen');
  screen.append(h('section', {id: 'denied', class: 'ui-card pt-denied', hidden: true, role: 'alert'}, h('h2', {text: '当前角色无权访问此页面'}), h('p', {text: '切换到有权限的角色后再查看。'})));
  for (const page of data.pages) {
    const section = h('section', {class: 'pt-page', 'data-page-id': page.page_id, tabindex: '-1', hidden: true});
    section.innerHTML = page.markup;
    applyRoles(section);
    sections.set(page.page_id, section);
    screen.append(section);
  }
  for (const page of data.pages) {
    if (!page.script) continue;
    try { new Function('page', 'P', page.script)(sections.get(page.page_id), P); } catch (error) { report(page.page_id, error); }
  }
  document.addEventListener('submit', event => event.preventDefault(), true);
  document.addEventListener('click', event => {
    const goto = event.target.closest('[data-goto]');
    if (goto) { event.preventDefault(); const values = {}; for (const [key, value] of Object.entries(goto.dataset)) if (key.startsWith('param')) values[key.slice(5).toLowerCase()] = value; P.go(goto.dataset.goto, values); return; }
    // In the workbench preview (srcdoc) a "#page" link resolves against the workbench URL and would load the workbench
    // into the frame, so in-page anchors switch pages here instead of navigating.
    const anchor = event.target.closest('a[href^="#"]');
    if (anchor && !event.defaultPrevented) {
      event.preventDefault();
      let id = ''; try { id = decodeURIComponent(anchor.getAttribute('href').slice(1)); } catch { /* ignore */ }
      if (pages.has(id)) P.go(anchor.dataset.page || id);
      else if (id) document.getElementById(id)?.scrollIntoView();
      return;
    }
    const state = event.target.closest('[data-show-state]');
    if (state) { event.preventDefault(); setState(state.dataset.showState); }
  });
  window.addEventListener('message', event => {
    if (event.source !== parent || !event.data || typeof event.data.type !== 'string') return;
    if (event.data.type === 'prototype:go' && pages.has(event.data.page_id)) P.go(event.data.page_id);
    if (event.data.type === 'prototype:pick') { if (event.data.on) { startPicking(); embeddedPick = true; } else stopPicking(); }
    if (event.data.type === 'prototype:annotate') { if (event.data.on) document.documentElement.dataset.annotate = ''; else delete document.documentElement.dataset.annotate; }
  });
  window.addEventListener('hashchange', () => { let id = ''; try { id = decodeURIComponent(location.hash.slice(1)); } catch { /* fall back */ } show(id); sections.get(current)?.focus({preventScroll: true}); window.scrollTo(0, 0); });
  let first = '';
  try { first = decodeURIComponent(location.hash.slice(1)); } catch { /* invalid fragment falls back to start page */ }
  // The workbench embeds this page through srcdoc, where it cannot set a fragment: it names the page to open instead.
  const preset = document.documentElement.dataset.startPage;
  show(first || (pages.has(preset) ? preset : data.start_page_id));
})();
</script></body></html>
