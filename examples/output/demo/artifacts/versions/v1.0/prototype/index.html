<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>交互原型</title>
<style>/* Product requirements workbench design system v1.0 — self-contained, no external assets */
:root {
  color-scheme: light;
  --ui-page: #f3f6fb;
  --ui-surface: #ffffff;
  --ui-muted-surface: #edf2f8;
  --ui-ink: #17243b;
  --ui-muted: #5b6b83;
  --ui-border: #dfe6ef;
  --ui-accent: #315efb;
  --ui-accent-hover: #2449d8;
  --ui-nav: #101b33;
  --ui-nav-ink: #edf3ff;
  --ui-success: #13875c;
  --ui-warning: #b75c0a;
  --ui-danger: #c33d4d;
  --ui-radius: 14px;
  --wb-navy: #101b33;
  --wb-blue: #315efb;
  --wb-purple: #7557e8;
  --wb-green: #13875c;
  --wb-orange: #c26912;
  --wb-red: #c33d4d;
  --wb-text: #17243b;
  --wb-muted: #607089;
  --wb-line: #e3e9f1;
  --wb-page: #f3f6fb;
  --wb-card: #ffffff;
  font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  color: var(--wb-text);
  background: var(--wb-page);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--wb-page); color: var(--wb-text); }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
a { color: var(--ui-accent-hover); text-underline-offset: 3px; }
button, a { -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid #88a2ff; outline-offset: 3px; }
[hidden] { display: none !important; }
svg { display: block; }
.wb-sidebar svg, .wb-topbar svg, .wb-btn svg, .wb-metric svg, .wb-mobile-nav svg, .wb-scroll-top svg, .wb-doc-actions svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.wb-sidebar { position: fixed; inset: 0 auto 0 0; z-index: 30; display: flex; flex-direction: column; width: 248px; height: 100vh; height: 100dvh; padding: 26px 18px 20px; color: #dbe6ff; background: linear-gradient(175deg, #142443 0%, #101b33 54%, #0c1629 100%); border-right: 1px solid #243554; }
.wb-brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 25px; }
.wb-brand-mark { display: grid; place-items: center; width: 40px; height: 40px; color: #fff; background: linear-gradient(145deg, #4e79ff, #6e55e8); border-radius: 12px; box-shadow: 0 8px 20px #050d2059; }
.wb-brand-mark svg { width: 23px; height: 23px; }
.wb-brand strong { display: block; color: #fff; font-size: 16px; letter-spacing: .02em; }
.wb-brand span:not(.wb-brand-mark) { display: block; margin-top: 2px; color: #8093b8; font-size: 10px; letter-spacing: .15em; }
.wb-side-project { margin: 0 4px 22px; padding: 15px 16px; background: #ffffff0a; border: 1px solid #ffffff12; border-radius: 12px; }
.wb-side-project > span { display: block; color: #8194b9; font-size: 11px; }
.wb-side-project strong { display: -webkit-box; margin: 5px 0; overflow: hidden; color: #eef4ff; font-size: 13px; line-height: 1.5; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wb-side-project small { color: #9fb2d5; font-size: 11px; }
.wb-nav { display: grid; gap: 5px; }
.wb-nav a { display: flex; align-items: center; gap: 11px; min-height: 44px; padding: 10px 12px; color: #aebcda; border: 1px solid transparent; border-radius: 10px; text-decoration: none; transition: color .18s, background .18s, border-color .18s; }
.wb-nav a:hover { color: #fff; background: #ffffff0b; }
.wb-nav a[aria-current="location"] { color: #fff; background: linear-gradient(90deg, #315efb3d, #315efb14); border-color: #5278ff38; box-shadow: inset 3px 0 #6f91ff; }
.wb-nav a[aria-current="location"] svg { color: #8da8ff; }
.wb-nav-count { min-width: 24px; margin-left: auto; padding: 0 6px; color: #b8c8e8; background: #ffffff0e; border-radius: 20px; font-size: 11px; text-align: center; }
.wb-warning-count { color: #ffd593; background: #c2691226; }
.wb-side-foot { margin-top: auto; padding: 18px 10px 0; color: #a9b9d4; border-top: 1px solid #ffffff10; font-size: 12px; line-height: 1.5; }
.wb-side-foot small { display: block; margin-top: 6px; color: #8ea2c6; font-size: 11px; }
.wb-live-dot { display: inline-block; width: 7px; height: 7px; margin-right: 7px; background: #38c98b; border-radius: 50%; box-shadow: 0 0 0 4px #38c98b15; }
.wb-page { min-width: 0; margin-left: 248px; }
.wb-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; min-height: 70px; padding: 12px 34px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--wb-line); backdrop-filter: blur(12px); }
.wb-breadcrumb { display: flex; align-items: center; gap: 9px; color: #7a889c; font-size: 13px; white-space: nowrap; }
.wb-breadcrumb b { color: #bdc6d3; font-weight: 400; }
.wb-breadcrumb strong { color: #34435a; font-weight: 600; }
.wb-top-actions { display: flex; align-items: center; gap: 12px; }
.wb-search { display: flex; align-items: center; gap: 8px; width: 300px; min-height: 42px; padding: 0 12px; color: #8290a5; background: #f5f7fb; border: 1px solid #e2e8f0; border-radius: 10px; }
.wb-search svg { width: 18px; height: 18px; }
.wb-search input { width: 100%; min-width: 0; color: var(--wb-text); background: transparent; border: 0; outline: 0; font-size: 16px; }
.wb-search:focus-within { background: #fff; border-color: #8ca6ff; box-shadow: 0 0 0 3px #315efb12; }
.wb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 9px 16px; border: 1px solid transparent; border-radius: 10px; font-weight: 600; font-size: 13px; text-decoration: none; cursor: pointer; transition: transform .16s, background .16s, border-color .16s, box-shadow .16s; }
.wb-btn:hover { transform: translateY(-1px); }
.wb-btn:active { transform: translateY(0); }
.wb-btn-primary { color: #fff; background: var(--wb-blue); border-color: var(--wb-blue); box-shadow: 0 6px 14px #315efb26; }
.wb-btn-primary:hover { background: var(--ui-accent-hover); box-shadow: 0 8px 18px #315efb35; }
.wb-btn-secondary { color: #35445b; background: #fff; border-color: #dce4ee; }
.wb-btn-secondary:hover { background: #f7f9fc; border-color: #c6d2e2; }
.wb-btn-ghost { color: #53647d; background: transparent; border-color: transparent; }
.wb-btn-ghost:hover { background: #edf2f8; }
.wb-main { width: 100%; max-width: 1480px; min-width: 0; padding: 32px 34px 64px; margin: 0 auto; }
main section[id] { scroll-margin-top: 90px; }
.wb-hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 32px; padding: 38px; overflow: hidden; color: #fff; background: radial-gradient(circle at 88% 10%, #5b73c945 0, transparent 38%), linear-gradient(125deg, #172b50 0%, #1e3765 48%, #2d497a 100%); border: 1px solid #314c7d; border-radius: 22px; box-shadow: 0 18px 42px #162a4b20; }
.wb-hero::after { content: ""; position: absolute; right: -90px; bottom: -150px; width: 360px; height: 360px; border: 1px solid #ffffff12; border-radius: 50%; box-shadow: 0 0 0 52px #ffffff05, 0 0 0 104px #ffffff04; pointer-events: none; }
.wb-hero-copy { position: relative; z-index: 1; min-width: 0; }
.wb-eyebrow { display: flex; align-items: center; gap: 12px; color: #9fb7ea; font-size: 10px; font-weight: 700; letter-spacing: .14em; }
.wb-eyebrow i { width: 3px; height: 3px; background: #7e9bdf; border-radius: 50%; }
.wb-eyebrow span:last-child { letter-spacing: .06em; }
.wb-hero h1 { max-width: 820px; margin: 14px 0 12px; color: #fff; font-size: 34px; line-height: 1.3; letter-spacing: -.02em; overflow-wrap: anywhere; }
.wb-hero-desc { max-width: 760px; margin: 0; color: #c3d2ed; font-size: 14px; line-height: 1.8; overflow-wrap: anywhere; }
.wb-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.wb-badge { display: inline-flex; align-items: center; min-height: 26px; padding: 3px 10px; color: #d4e0f5; background: #ffffff0d; border: 1px solid #ffffff18; border-radius: 6px; font-size: 11px; }
.wb-badge-info { color: #dbe7ff; background: #5f8cff24; border-color: #7da1ff35; }
.wb-badge-warning { color: #ffe0aa; background: #d88b2820; border-color: #e5a14b35; }
.wb-hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.wb-hero-actions .wb-btn-secondary { color: #edf3ff; background: #ffffff0b; border-color: #ffffff24; }
.wb-hero-actions .wb-btn-secondary:hover { background: #ffffff16; }
.wb-progress-card { position: relative; z-index: 1; align-self: stretch; padding: 22px; background: rgba(9,20,42,.36); border: 1px solid #ffffff1c; border-radius: 17px; backdrop-filter: blur(8px); }
.wb-card-kicker { color: #a8bade; font-size: 12px; font-weight: 600; }
.wb-progress-main { position: relative; display: grid; place-items: center; min-height: 160px; }
.wb-donut { width: 148px; height: 148px; transform: rotate(-90deg); }
.wb-donut circle { fill: none; stroke-width: 8; }
.wb-donut-track { stroke: #ffffff13; }
.wb-donut-value { stroke: #79a0ff; stroke-linecap: round; }
.wb-progress-number { position: absolute; display: grid; text-align: center; }
.wb-progress-number strong { font-size: 32px; line-height: 1.2; }
.wb-progress-number strong span { margin-left: 2px; color: #a9bde4; font-size: 15px; }
.wb-progress-number small { margin-top: 5px; color: #bdcce8; font-size: 11px; }
.wb-progress-foot { display: grid; gap: 5px; padding-top: 14px; color: #9fb2d5; border-top: 1px solid #ffffff12; font-size: 11px; overflow-wrap: anywhere; }
.wb-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin: 20px 0; }
.wb-metric { display: flex; align-items: center; gap: 14px; min-width: 0; padding: 19px; background: #fff; border: 1px solid var(--wb-line); border-radius: 15px; box-shadow: 0 4px 12px #21385b05; }
.wb-metric-icon { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto; border-radius: 12px; }
.wb-tone-purple { color: #6e50d8; background: #f0ebff; }
.wb-tone-blue { color: #3264d9; background: #e9f1ff; }
.wb-tone-orange { color: #b75c0a; background: #fff2df; }
.wb-tone-green { color: #13875c; background: #e6f7ef; }
.wb-metric div { display: grid; min-width: 0; }
.wb-metric small { color: #738198; font-size: 11px; }
.wb-metric strong { margin: 1px 0; color: #1b2c47; font-size: 25px; line-height: 1.3; }
.wb-metric div > span { color: #738198; font-size: 11px; white-space: normal; }
.wb-card { min-width: 0; padding: 23px; background: var(--wb-card); border: 1px solid var(--wb-line); border-radius: 16px; box-shadow: 0 5px 16px #20355806; }
.wb-review-queue { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding: 18px 22px; background: linear-gradient(90deg, #fff8eb, #fffbf4); border: 1px solid #f0ddba; border-radius: 15px; }
.wb-review-queue > svg { width: 24px; height: 24px; flex: 0 0 auto; color: #b75c0a; fill: none; stroke: currentColor; stroke-width: 1.8; }
.wb-review-queue div { flex: 1; min-width: 0; }
.wb-review-queue strong { display: block; color: #76400c; font-size: 14px; }
.wb-review-queue p { margin: 3px 0 0; color: #956429; font-size: 12px; }
.wb-review-queue a { flex: 0 0 auto; color: #9b500c; font-size: 12px; font-weight: 600; }
.wb-overview-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(280px, .85fr); gap: 20px; }
.wb-overview-side { display: grid; gap: 20px; align-content: start; }
.wb-section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.wb-section-kicker { display: block; margin-bottom: 4px; color: #7b8ba5; font-size: 9px; font-weight: 700; letter-spacing: .13em; }
.wb-section-head h2, .wb-doc-card h2 { margin: 0; color: #1b2b45; font-size: 19px; line-height: 1.4; }
.wb-section-head p { margin: 5px 0 0; color: #75849a; font-size: 12px; }
.wb-soft-label, .wb-count-pill { display: inline-flex; align-items: center; min-height: 27px; padding: 3px 10px; color: #63738c; background: #f1f5fa; border: 1px solid #e5ebf3; border-radius: 20px; font-size: 10px; white-space: nowrap; }
.wb-profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.wb-profile-item { min-width: 0; padding: 14px; background: #f8fafd; border: 1px solid #edf1f6; border-radius: 11px; }
.wb-profile-item span { display: block; margin-bottom: 4px; color: #5870a0; font-size: 11px; font-weight: 700; }
.wb-profile-item p { margin: 0; color: #46566e; font-size: 12px; line-height: 1.65; overflow-wrap: anywhere; }
.wb-status-chart { display: grid; gap: 15px; }
.wb-status-row { display: grid; grid-template-columns: 62px minmax(0, 1fr) 22px; align-items: center; gap: 10px; font-size: 11px; }
.wb-status-row > span { color: #64748a; }
.wb-status-row > strong { color: #3d4d65; text-align: right; }
.wb-bar-track { height: 7px; overflow: hidden; background: #edf1f6; border-radius: 10px; }
.wb-bar-value { display: block; height: 100%; min-width: 0; border-radius: 10px; }
.wb-bar-draft { background: #6c8cf5; }.wb-bar-confirmed { background: #27a675; }.wb-bar-disputed { background: #e69a3b; }.wb-bar-parked { background: #a2adbd; }
.wb-chart-note { margin-top: 20px; padding-top: 14px; color: #8390a3; border-top: 1px solid #edf1f5; font-size: 10px; }
.wb-empty-inline { display: grid; gap: 4px; padding: 14px; color: #75849a; background: #f8fafc; border: 1px dashed #dbe3ed; border-radius: 10px; font-size: 12px; }
.wb-empty-inline strong { color: #53647c; font-size: 12px; }
.wb-source-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.wb-source-list li { color: #5b6c83; font-size: 12px; overflow-wrap: anywhere; }
.wb-section { margin-top: 30px; }
.wb-section-head-lg { padding: 0 2px; }
.wb-section-head-lg h2 { font-size: 22px; }
.wb-toolbar { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 14px; padding: 13px 16px; background: #fff; border: 1px solid var(--wb-line); border-radius: 12px; }
.wb-field { display: flex; align-items: center; gap: 8px; color: #66768d; font-size: 11px; }
.wb-field select { min-height: 40px; padding: 6px 30px 6px 10px; color: #3a4c66; background: #f7f9fc; border: 1px solid #dfe6ef; border-radius: 8px; font-size: 16px; }
.wb-toolbar-note { flex: 1; color: #8a96a8; font-size: 11px; text-align: center; }
.wb-evidence-list { display: grid; gap: 10px; }
.wb-evidence-item { overflow: hidden; background: #fff; border: 1px solid var(--wb-line); border-radius: 13px; transition: border-color .16s, box-shadow .16s; }
.wb-evidence-item:hover { border-color: #c6d4e8; box-shadow: 0 5px 16px #233c6308; }
.wb-evidence-item[open] { border-color: #b8c9ef; box-shadow: 0 6px 20px #315efb0b; }
.wb-evidence-item summary { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 64px; padding: 15px 46px 15px 17px; cursor: pointer; list-style: none; }
.wb-evidence-item summary::-webkit-details-marker { display: none; }
.wb-evidence-item summary::after { content: ""; position: absolute; right: 20px; width: 7px; height: 7px; border-right: 2px solid #8290a5; border-bottom: 2px solid #8290a5; transform: rotate(45deg); transition: transform .16s; }
.wb-evidence-item[open] summary::after { transform: rotate(225deg); }
.wb-evidence-summary { min-width: 0; }
.wb-evidence-summary strong { display: block; color: #2b3c55; font-size: 13px; font-weight: 600; line-height: 1.6; }
.wb-evidence-summary small { display: block; margin-top: 3px; color: #738198; font-size: 11px; overflow-wrap: anywhere; }
.wb-evidence-time { min-width: 72px; color: #4b658f; font-size: 12px; font-weight: 600; text-align: right; white-space: nowrap; }
.wb-level { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; min-height: 25px; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; }
.wb-level-E1 { color: #146f50; background: #e7f6ef; border: 1px solid #c6ebdb; }
.wb-level-E2 { color: #3f5fbf; background: #edf2ff; border: 1px solid #d5e0fa; }
.wb-level-E3 { color: #6b4bb5; background: #f2edff; border: 1px solid #e1d6f8; }
.wb-level-E0 { color: #a65209; background: #fff3e2; border: 1px solid #f1ddbd; }
.wb-evidence-detail { padding: 0 18px 18px 69px; }
.wb-evidence-detail blockquote { margin: 0; padding: 16px 18px; color: #2f425e; background: #f7f9fd; border-left: 3px solid #6b8ef0; border-radius: 0 10px 10px 0; font-size: 13px; line-height: 1.85; }
.wb-evidence-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 12px; color: #6f7f95; font-size: 11px; }
.wb-evidence-meta span { overflow-wrap: anywhere; }
.wb-copy-btn { min-height: 32px; padding: 4px 10px; color: #496082; background: #fff; border: 1px solid #dce4ef; border-radius: 7px; font-size: 10px; cursor: pointer; }
.wb-related-req { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.wb-related-req a { display: inline-flex; align-items: center; min-height: 30px; padding: 3px 9px; color: #4b62a0; background: #f0f4ff; border-radius: 6px; font-size: 10px; text-decoration: none; }
.wb-filter-tabs { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 15px; }
.wb-filter-tabs button { min-height: 40px; padding: 7px 15px; color: #63738a; background: #fff; border: 1px solid #dfe6ef; border-radius: 9px; font-size: 12px; cursor: pointer; }
.wb-filter-tabs button:hover { background: #f4f7fb; }
.wb-filter-tabs button.active { color: #fff; background: #315efb; border-color: #315efb; box-shadow: 0 4px 10px #315efb20; }
.wb-requirement-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; align-items: start; }
.wb-requirement-card { min-width: 0; padding: 21px; background: #fff; border: 1px solid var(--wb-line); border-radius: 15px; box-shadow: 0 4px 14px #20355805; }
.wb-req-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.wb-req-id { color: #5269b4; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.wb-req-title { margin: 6px 0 0; color: #1c2e49; font-size: 17px; line-height: 1.45; }
.wb-status { display: inline-flex; align-items: center; min-height: 25px; padding: 2px 9px; border-radius: 20px; font-size: 10px; white-space: nowrap; }
.wb-status-draft { color: #4564be; background: #edf2ff; }.wb-status-confirmed { color: #14744f; background: #e5f6ee; }.wb-status-disputed { color: #a65309; background: #fff1dd; }.wb-status-parked { color: #6f7b8c; background: #edf0f4; }
.wb-req-desc { margin: 13px 0; color: #5a6b82; font-size: 12px; line-height: 1.75; }
.wb-req-facts { display: grid; gap: 8px; margin: 0; }
.wb-req-facts div { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; font-size: 12px; }
.wb-req-facts dt { color: #738198; font-weight: 600; }.wb-req-facts dd { margin: 0; color: #53647c; overflow-wrap: anywhere; }
.wb-req-questions { margin-top: 14px; padding: 11px 12px; color: #885015; background: #fff8eb; border: 1px solid #f1e0bf; border-radius: 9px; font-size: 12px; line-height: 1.65; }
.wb-req-questions strong { display: block; margin-bottom: 4px; }
.wb-req-questions ul { margin: 0; padding-left: 17px; }
.wb-req-questions li + li { margin-top: 4px; }
.wb-req-details { margin-top: 13px; border-top: 1px solid #edf1f5; }
.wb-req-details summary { min-height: 42px; padding: 12px 0 4px; color: #536ca5; font-size: 11px; font-weight: 600; cursor: pointer; }
.wb-req-details h4 { margin: 12px 0 6px; color: #53647c; font-size: 11px; }
.wb-req-details ol { margin: 0; padding-left: 20px; color: #53647c; font-size: 12px; }
.wb-req-details li + li { margin-top: 5px; }
.wb-req-evidence { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.wb-req-evidence a { padding: 3px 7px; color: #5d6f92; background: #f2f5f9; border-radius: 5px; font-size: 9px; text-decoration: none; overflow-wrap: anywhere; }
.wb-req-lock { margin-top: 12px; color: #75849a; font-size: 11px; }
.wb-empty { display: grid; place-items: center; gap: 5px; min-height: 140px; margin-top: 12px; color: #8592a5; background: #fff; border: 1px dashed #d4deea; border-radius: 13px; }
.wb-empty strong { color: #56667d; }
.wb-model-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.wb-model-card { min-width: 0; padding: 22px; background: #fff; border: 1px solid var(--wb-line); border-radius: 15px; }
.wb-model-card h3 { margin: 0 0 14px; color: #2b3c55; font-size: 15px; }

    const card = node('section', undefined, 'ui-card'); if (page.task) card.append(node('h2', page.task));
    if (page.description) card.append(node('p', page.description, 'prototype-meta'));
    if ((page.fields || []).length || (page.actions || []).length) card.append(buildForm(page)); else card.append(feedbackNode());
    host.append(card); if (page.hide_records !== true) host.append(recordsTable(page));
  }
  document.getElementById('confirm-archive').addEventListener('click', () => {
    if (!archiveTarget) return;
    const row = (records.get(archiveTarget.pageId) || []).find(item => item._record_id === archiveTarget.recordId);
    if (row) {row.archived = true; setFeedback((row.name || row.title || row.record_id || row._record_id) + ' 已归档（模拟）；默认查询已排除，历史记录保留。');}
    document.getElementById('archive-dialog').close(); archiveTarget = null; render();
  });
  document.getElementById('cancel-archive').addEventListener('click', () => {archiveTarget = null; document.getElementById('archive-dialog').close(); setFeedback('已取消归档，记录保持不变。'); render();});
  document.getElementById('archive-dialog').addEventListener('cancel', () => {archiveTarget = null; setFeedback('已取消归档，记录保持不变。');});
  document.getElementById('project-name').textContent = data.name;
  document.getElementById('version').textContent = '交互原型 · ' + data.artifact_version + ' · 示例数据／接口模拟 · 数据保留在本页面会话';
  data.pages.forEach(page => {const link = node('a', page.name || page.page_id); link.href = '#' + encodeURIComponent(page.page_id); link.dataset.page = page.page_id; document.getElementById('pages').append(link);});
  window.addEventListener('hashchange', () => {emptyMode = false; setFeedback(''); render(); document.getElementById('title').focus();});
  render();
})();
</script></body></html>
