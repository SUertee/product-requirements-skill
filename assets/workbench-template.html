<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品需求落地 · 项目工作台</title>
<style>__WORKBENCH_STYLE__</style>
</head>
<body>
<div class="workspace">
<aside class="sidebar" aria-label="项目导航">
<div class="brand-row"><a href="#overview" class="brand"><span class="brand-text" id="project-brand">项目工作台</span></a><button class="sidebar-icon" id="open-search" type="button" aria-label="搜索" title="搜索"></button></div>
<nav class="nav-list" id="navigation"></nav>
<button class="nav-button sidebar-toggle" id="toggle-sidebar" type="button" aria-expanded="true"><span class="nav-label">收起侧栏</span></button>
</aside>
<main class="main-shell">
<div class="content">
<header class="page-header"><h1 class="page-title" id="page-title" tabindex="-1">总览</h1></header>
<div class="workbench-toolbar" role="search">
<label class="sr-only" for="search">搜索需求、原话或模块</label><input id="search" type="search" aria-label="搜索需求、原话或模块" placeholder="搜索需求、原话或模块">
<select id="status" aria-label="需求状态"><option value="">全部需求状态</option><option value="draft">草稿</option><option value="confirmed">已确认</option><option value="disputed">冲突</option><option value="parked">暂缓</option><option value="cancelled">已取消</option></select>
<select id="evidence" aria-label="证据类型"><option value="">全部证据类型</option><option value="E1">E1 · 明确表达</option><option value="E2">E2 · 上下文推断</option><option value="E3">E3 · 产品建议</option><option value="E0">E0 · 缺失或冲突</option></select>
</div>
<div id="page-content" class="requirement-pages" aria-live="polite"></div>
</div>
</main>
</div>
<script id="workbench-data" type="application/json">__WORKBENCH_DATA__</script>
<script>__WORKBENCH_SCRIPT__</script>
</body>
</html>
