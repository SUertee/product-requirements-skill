  <script>
    (() => {
      const input = new URLSearchParams(window.JOURNEY_TRACE_PREVIEW_PARAMS ?? location.search);
      const embedded = input.get('embed') === '1' && window.parent !== window;
      const baseOrigin = new URL(document.baseURI).origin;
      const targetOrigin = baseOrigin === 'null' ? '*' : baseOrigin;
      const send = (type,reason) => {
        if (!embedded) return;
        try {
          window.parent.postMessage({type,reason,screen:input.get('screen'),previewId:input.get('previewId')},targetOrigin);
        } catch (error) {
          console.warn('原型就绪消息发送失败',error);
        }
      };
      const ready = () => { document.documentElement.dataset.appReady = 'true'; send('journey-trace:preview-ready'); };
      window.addEventListener('journey-trace:rendered',ready);
      if (!embedded) return;
      window.addEventListener('message',event => {
        if ((event.origin === baseOrigin || event.origin === 'null') && event.source === window.parent && event.data?.type === 'journey-trace:preview-ready-request' && event.data.previewId === input.get('previewId') && document.documentElement.dataset.appReady === 'true') send('journey-trace:preview-ready');
      });
      window.addEventListener('error',event => {
        if (document.documentElement.dataset.appReady === 'true') return;
        const script = event.target?.tagName === 'SCRIPT' && event.target.src.includes('/app.js');
        const appSource = /(?:^|\/)app\.js(?:[?#]|$)/.test(event.filename || '');
        const inlineApp = document.querySelector('script[data-preview-app]') && event.filename === document.URL;
        if (script || appSource || inlineApp) send('journey-trace:preview-error',script ? 'script-unavailable' : 'render-failed');
      },true);
    })();
  </script>
  <script src="app.js?v=preview-handshake-20261010"></script>
