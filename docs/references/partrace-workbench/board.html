/* finesse · register=product+h5 · A=approved-poster-blue · B=Chinese-system-type · C=compact-six-screen-board · D=scale-switch+source-export · E=quiet-light-surfaces · SOUL=5 SPECTACLE=1 DENSITY=4 */
:root{--bg:#eef4fa;--ink:#1c2a3b;--muted:#50657d;--accent:#006fd6;--accent-ink:#005bb4;--soft:#e1effe;--bezel:#111d2d;--line:rgba(28,42,59,.18);--white:#fcfdfe;--phone-scale:.6666667;--phone-width:260px;--phone-height:562.667px;--columns:3;--gap:24px;--font:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-width:0}body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);padding:28px 24px 24px}h1,h2,p{margin:0}.board{max-width:1776px;min-width:0;margin:auto}.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px 24px;padding-bottom:20px;border-bottom:1px solid var(--line)}.heading{min-width:0}.brand{color:var(--accent-ink);font-size:13px;font-weight:600;margin-bottom:4px}h1{font-size:28px;font-weight:700;line-height:1.4;letter-spacing:-.4px}.header p{margin-top:5px;color:var(--muted);font-size:13px}.board-actions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px}.size-switch{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--white)}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}.size-switch button{min-height:38px;min-width:58px;padding:6px 10px;color:var(--muted);border:0;border-radius:7px;background:transparent;font-size:13px}.size-switch button[aria-pressed="true"]{color:var(--accent-ink);background:var(--soft);font-weight:650}.size-switch button:active{transform:translateY(1px)}a{color:var(--accent-ink);text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.open-app{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 13px;background:var(--accent);color:var(--white);border-radius:9px;font-size:13px;font-weight:600}.open-app:hover{background:var(--accent-ink);text-decoration:none}#board-export-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px}#board-export-controls:empty,#board-export-status:empty{display:none}#board-export-status{margin-top:12px;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));gap:32px var(--gap);min-width:0;padding:24px 0}.screen-tile{display:flex;flex-direction:column;align-items:center;min-width:0}.stage-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:var(--phone-width);max-width:100%;margin-bottom:12px}.stage-title{display:flex;align-items:center;gap:8px;min-width:0;font-size:15px;line-height:1.5;font-weight:650}.num{display:grid;place-items:center;flex:0 0 25px;height:25px;border-radius:7px;background:var(--soft);color:var(--accent-ink);font-size:11px;font-weight:600}.enlarge{flex:0 0 auto;display:inline-flex;align-items:center;min-height:36px;font-size:12px;white-space:nowrap}.phone{position:relative;flex:0 0 auto;width:var(--phone-width);height:var(--phone-height);border-radius:calc(38px * var(--phone-scale));overflow:hidden;background:var(--white);box-shadow:0 6px 18px rgba(36,51,71,.1),0 0 0 4px var(--bezel)}.phone iframe{display:block;width:390px;height:844px;max-width:none;border:0;transform:scale(var(--phone-scale));transform-origin:top left;background:var(--white)}.caption{width:var(--phone-width);max-width:100%;margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6}footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 20px;padding-top:15px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media(max-width:640px){:root{--columns:1;--gap:18px}body{padding:20px 16px}.header{align-items:flex-start;padding-bottom:16px}h1{font-size:24px}.board-actions{justify-content:flex-start;width:100%;gap:8px}.size-switch button{min-height:40px;min-width:56px}.grid{padding-top:22px;row-gap:28px}.stage-title{font-size:14px}.open-app{padding-inline:11px}}
@media(hover:hover) and (pointer:fine){.size-switch button:hover{color:var(--accent-ink);background:var(--soft)}}
@media print{body{padding:12px}.board-actions,#board-export-status,.enlarge{display:none}.screen-tile{break-inside:avoid}.phone{box-shadow:0 0 0 1px var(--bezel)}}
</style>
<style>
:root{--ink-1:var(--ink);--ink-2:var(--muted);--page:var(--bg);--border:var(--line);--border-strong:var(--line);--surface-19:rgba(17,29,45,.5);--r:16px;--r-sm:10px}
html,body{overflow-x:clip}
.size-switch button,.enlarge{min-height:44px}
#board-export-controls .button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--accent-ink);font-size:13px;white-space:nowrap}
#board-export-controls .button.primary{background:var(--soft);border-color:var(--line);font-weight:600}
#board-export-controls .button:disabled{opacity:.6;cursor:wait}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

<body>
<main class="board">
<header class="header">
  <div class="heading"><p class="brand">驿站追迹</p><h1>六屏原型</h1><p>首页 → AI 核查 → 证据 → 留档</p></div>
  <div class="board-actions">
    <div class="size-switch" role="group" aria-label="原型预览尺寸"><button type="button" data-preview-width="260" aria-pressed="true">紧凑</button><button type="button" data-preview-width="312" aria-pressed="false">标准</button><button type="button" data-preview-width="390" aria-pressed="false">大图</button></div>
    <div id="board-export-controls"></div>
    <a class="open-app" href="index.html">体验 App ↗</a>
  </div>
</header>
<p id="board-export-status" role="status" aria-live="polite"></p>
<section class="grid" aria-label="六屏 App 原型总览">
  <article class="screen-tile"><div class="stage-head"><h2 class="stage-title"><span class="num">01</span>驿站首页</h2><a class="enlarge" aria-label="放大查看驿站首页" href="index.html?screen=home">放大 ↗</a></div><div class="phone"><iframe title="驿站首页原型" src="index.html?screen=home&amp;embed=1&amp;presentation=1&amp;theme=poster-20261010-final"></iframe></div><p class="caption">整体活动与待核查线索</p></article>
  <article class="screen-tile"><div class="stage-head"><h2 class="stage-title"><span class="num">02</span>AI 核查</h2><a class="enlarge" aria-label="放大查看 AI 核查" href="index.html?screen=agent">放大 ↗</a></div><div class="phone"><iframe title="AI 核查原型" src="index.html?screen=agent&amp;embed=1&amp;presentation=1&amp;theme=poster-20261010-final"></iframe></div><p class="caption">输入问题，确认检索计划</p></article>
  <article class="screen-tile"><div class="stage-head"><h2 class="stage-title"><span class="num">03</span>候选事件</h2><a class="enlarge" aria-label="放大查看候选事件" href="index.html?screen=results">放大 ↗</a></div><div class="phone"><iframe title="候选事件原型" src="index.html?screen=results&amp;embed=1&amp;presentation=1&amp;theme=poster-20261010-final"></iframe></div><p class="caption">按区域与时间缩小范围</p></article>
  <article class="screen-tile"><div class="stage-head"><h2 class="stage-title"><span class="num">04</span>路线与画面</h2><a class="enlarge" aria-label="放大查看路线与画面" href="index.html?screen=journey">放大 ↗</a></div><div class="phone"><iframe title="路线与画面原型" src="index.html?screen=journey&amp;embed=1&amp;presentation=1&amp;theme=poster-20261010-final"></iframe></div><p class="caption">路线、时间线与关键帧联动</p></article>
  <article class="screen-tile"><div class="stage-head"><h2 class="stage-title"><span class="num">05</span>核查保存</h2><a class="enlarge" aria-label="放大查看核查保存" href="index.html?screen=review">放大 ↗</a></div><div class="phone"><iframe title="核查保存原型" src="index.html?screen=review&amp;embed=1&amp;presentation=1&amp;theme=poster-20261010-final"></iframe></div><p class="caption">人工确认并保存决定</p></article>
  <article class="screen-tile"><div class="stage-head"><h2 class="stage-title"><span class="num">06</span>核查记录</h2><a class="enlarge" aria-label="放大查看核查记录" href="index.html?screen=records">放大 ↗</a></div><div class="phone"><iframe title="核查记录原型" src="index.html?screen=records&amp;embed=1&amp;presentation=1&amp;theme=poster-20261010-final"></iframe></div><p class="caption">回读事件、证据与人工说明</p></article>
</section>
<footer><p>固定 390 × 844 视口，可切换预览大小。</p><p>当前页面、数据与 AI 回答为演示样例。</p></footer>
</main>
<script>
(() => {
  'use strict';
  const root = document.documentElement;
  const grid = document.querySelector('.grid');
  const controls = [...document.querySelectorAll('[data-preview-width]')];
  let previewWidth = 260;
  let scheduled = false;
  function resizePreviews() {
    scheduled = false;
    const available = grid.getBoundingClientRect().width;
    if (!available) return;
    const gap = innerWidth <= 640 ? 18 : 24;
    const fit = Math.floor((available + gap) / (previewWidth + 8 + gap));
    const columns = fit >= 6 ? 6 : fit >= 3 ? 3 : fit >= 2 ? 2 : 1;
    const width = Math.min(previewWidth, (available - gap * (columns - 1)) / columns - 8);
    const scale = Math.max(0.2, width / 390);
    root.style.setProperty('--columns', String(columns));
    root.style.setProperty('--phone-scale', String(scale));
    root.style.setProperty('--phone-width', `${390 * scale}px`);
    root.style.setProperty('--phone-height', `${844 * scale}px`);
    controls.forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.previewWidth) === previewWidth)));
  }
  function scheduleResize() {
    if (!scheduled) { scheduled = true; requestAnimationFrame(resizePreviews); }
  }
  controls.forEach(button => button.addEventListener('click', () => { previewWidth = Number(button.dataset.previewWidth); resizePreviews(); }));
  if (typeof ResizeObserver === 'function') new ResizeObserver(scheduleResize).observe(grid);
  addEventListener('resize', scheduleResize);
  resizePreviews();
})();
</script>
